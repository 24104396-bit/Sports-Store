<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sports Store - Quần Áo Thể Thao</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        header { background: #333; color: #fff; padding: 15px; text-align: center; }
        .product-container { display: flex; gap: 20px; margin-top: 20px; }
        .product-card { background: #fff; padding: 15px; border: 1px solid #ddd; width: 200px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>Danh Mục Quần Áo Thể Thao Nam</h1>
    </header>
    <main>
        <div class="product-container">
            <div class="product-card">
                <h3>Áo Bóng Đá Nam</h3>
                <p>Giá: 150.000 đ</p>
                <button>Chọn Mua</button>
            </div>
            <div class="product-card">
                <h3>Quần Short Tập Gym</h3>
                <p>Giá: 120.000 đ</p>
                <button>Chọn Mua</button>
            </div>
        </div>
    </main>
</body>
</html>
